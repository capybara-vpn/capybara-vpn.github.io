name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Public origin. The repo variable wins when set (explicit domain),
          # otherwise it comes from actions/configure-pages, which already
          # reports the custom domain once it is configured in Pages settings.
          SITE_URL: ${{ vars.SITE_URL || format('{0}{1}', steps.pages.outputs.origin, steps.pages.outputs.base_path) }}
          ASTRO_BASE: ${{ steps.pages.outputs.base_path }}/
          # Optional repo variable; when empty the build uses the default
          # measurement id from src/data/site.ts.
          GA_ID: ${{ vars.GA_ID }}
          # Optional Yandex Metrika counter id; empty = the counter is not
          # loaded at all.
          YM_ID: ${{ vars.YM_ID }}
          # NOTE: if you use a custom domain, set SITE_URL to https://your-domain.com
          # and ASTRO_BASE to / (see README).

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # IndexNow: tells Bing / Yandex / other engines that the URLs changed
      # right after the deploy, instead of waiting for the next crawl.
      - name: Notify IndexNow
        continue-on-error: true
        run: |
          set -euo pipefail
          ORIGIN="https://capybaravpn.top"
          KEY="$(curl -fsS "$ORIGIN/indexnow-key.txt" || true)"
          if [ -z "$KEY" ]; then
            echo "IndexNow: ключ недоступен, пропускаем"
            exit 0
          fi
          URLS="$(curl -fsS "$ORIGIN/sitemap-0.xml" \
            | grep -o '<loc>[^<]*</loc>' \
            | sed 's|<loc>||;s|</loc>||' || true)"
          if [ -z "$URLS" ]; then
            echo "IndexNow: sitemap пуст, пропускаем"
            exit 0
          fi
          node -e '
            const urls = process.argv[1].split("\n").filter(Boolean);
            const body = {
              host: "capybaravpn.top",
              key: process.argv[2],
              keyLocation: "https://capybaravpn.top/indexnow-key.txt",
              urlList: urls,
            };
            fetch("https://api.indexnow.org/indexnow", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            })
              .then(async (r) => {
                console.log(`IndexNow: ${r.status} ${r.statusText} (${urls.length} URL)`);
                if (r.status >= 400) console.log(await r.text());
              })
              .catch((e) => console.log("IndexNow: ошибка", e.message));
          ' "$URLS" "$KEY"
