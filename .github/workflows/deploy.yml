name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Public origin. The repo variable wins when set (explicit domain),
          # otherwise it comes from actions/configure-pages, which already
          # reports the custom domain once it is configured in Pages settings.
          SITE_URL: ${{ vars.SITE_URL || format('{0}{1}', steps.pages.outputs.origin, steps.pages.outputs.base_path) }}
          ASTRO_BASE: ${{ steps.pages.outputs.base_path }}/
          # Optional repo variable; when empty the build uses the default
          # measurement id from src/data/site.ts.
          GA_ID: ${{ vars.GA_ID }}
          # Optional Yandex Metrika counter id; empty = the counter is not
          # loaded at all.
          YM_ID: ${{ vars.YM_ID }}
          # NOTE: if you use a custom domain, set SITE_URL to https://your-domain.com
          # and ASTRO_BASE to / (see README).

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
